name: hollow-tile-detector

services:
  app:
    build: .
    image: hollow-tile-detector:latest
    environment:
      PORT: 3000
    ports:
      # 宿主机端口可通过环境变量 HOST_PORT 配置，默认 8080
      - "${HOST_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  verify:
    image: hollow-tile-detector:latest
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:3000
    # 执行代码测试、构建检查与 API/HTTP 冒烟后自行退出，以退出码报告验收结论
    command: ["node", "scripts/verify.js"]
    restart: "no"
